name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  Format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.3.17
          experimental: true
          install: true
          cache: true
      - name: Check Formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
  Analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.3.17
          experimental: true
          install: true
          cache: true
      - name: Run check-sumtype
        shell: bash
        run: |
          mise run check-sumtype
      - name: Run constable
        shell: bash
        run: |
          mise run constable
  Test:
    runs-on: ${{ matrix.os }}
    name: Test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.3.17
          experimental: true
          install: true
          cache: true
      - name: Go Test
        run: mise run tests
